<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">അഖീദ - ക്ലാസ് 2 (അർദ്ദവാർഷിക പരീക്ഷ)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0b5ed7;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        p.sub {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .total-mark {
            text-align: center;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .student-info, .admin-login {
            background: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .student-info input, .admin-login input {
            flex: 1;
            padding: 8px;
            font-size: 0.95rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .section-title {
            background: #0b5ed7;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.95rem;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .question-box {
            margin-bottom: 15px;
            padding: 10px;
            background: #fdfdfe;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .question-box input[type="text"], .question-box select {
            padding: 6px;
            font-size: 0.9rem;
            border: 1px solid #bbb;
            border-radius: 4px;
            width: 95%;
            margin-top: 5px;
        }
        .options-group {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .submit-btn, .admin-action-btn {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        .admin-action-btn { background-color: #6c757d; }
        .submit-btn:hover { background-color: #1ebe5d; }
        #resultCard {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
            border-radius: 6px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .correct { border-left: 5px solid #198754; }
        .incorrect { border-left: 5px solid #dc3545; }
        .feedback { font-size: 0.85rem; margin-top: 5px; font-weight: bold; }
        .admin-section { display: none; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 5px; margin-right: 5px; }
        .edit-btn { background: #ffc107; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        
        @media print {
            .admin-section, .submit-btn, .student-info, .admin-login {
                display: none !important;
            }
            body { background: white; }
            .container { box-shadow: none; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- STUDENT VIEW -->
    <div id="studentView">
        <h2 id="displayMadrasaName">ബദ്റുൽ ഹുദാ മദ്റസ പൊറോപാട്</h2>
        <p class="sub" id="displayExamTitle">അഖീദ - ക്ലാസ് 2 (അർദ്ദവാർഷിക പരീക്ഷ)</p>
        <div class="total-mark" id="displayTotalMark">ആകെ മാർക്ക്: 50</div>

        <div class="student-info">
            <label for="studentName" style="font-weight:bold;">കുട്ടിയുടെ പേര്:</label>
            <input type="text" id="studentName" placeholder="പേര് ഇവിടെ എഴുതുക...">
        </div>

        <form id="quizForm" onsubmit="evaluateExam(event)">
            <div id="questionsContainer"></div>
            <button type="submit" class="submit-btn">📝 പരീക്ഷ സമർപ്പിച്ച് മാർക്ക് നോക്കുക</button>
        </form>

        <div id="resultCard"></div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminView" class="admin-section">
        <h2>അഡ്മിൻ പാനൽ (പരീക്ഷാ നിയന്ത്രണം)</h2>
        <div class="admin-login" id="adminLoginBox">
            <input type="password" id="adminPass" placeholder="പാസ്‌വേഡ് നൽകുക (admin123)">
            <button class="submit-btn" onclick="checkAdminLogin()" style="margin-top:0; width:auto; padding:8px 20px;">ലോഗിൻ</button>
        </div>

        <div id="adminPanelContent" style="display:none;">
            <p style="color: green; font-weight: bold;">✔ അഡ്മിൻ ലോഗിൻ വിജയിച്ചു!</p>
            
            <div class="section-title">സ്ഥാപനത്തിന്റെ പേരും വിഷയവും മാറ്റാൻ</div>
            <div class="question-box">
                <label>മദ്റസയുടെ / സ്ഥാപനത്തിന്റെ പേര്:</label><br>
                <input type="text" id="inputMadrasaName" value="ബദ്റുൽ ഹുദാ മദ്റസ പൊറോപാട്"><br><br>
                <label>പരീക്ഷയുടെ പേര് / വിഷയം / ക്ലാസ്:</label><br>
                <input type="text" id="inputExamTitle" value="അഖീദ - ക്ലാസ് 2 (അർദ്ദവാർഷിക പരീക്ഷ)"><br><br>
                <button class="admin-action-btn" onclick="saveHeaderSettings()" style="background: #0b5ed7;">✔ ഹെഡിങ് സേവ് ചെയ്യുക</button>
            </div>

            <div class="section-title">PDF പ്രിന്റ് / ഡൗൺലോഡ് ചെയ്യുക</div>
            <div class="question-box" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="admin-action-btn" onclick="downloadStudentPDF()" style="background: #198754; flex: 1; min-width: 200px;">📥 ചോദ്യപേപ്പർ മാത്രം PDF എടുക്കുക</button>
                <button class="admin-action-btn" onclick="downloadAnswerKeyPDF()" style="background: #d63384; flex: 1; min-width: 200px;">📥 ഉത്തരസഹിതം (Answer Key) PDF എടുക്കുക</button>
            </div>

            <div class="section-title" id="formTitleText">പുതിയ ചോദ്യം ചേർക്കാം</div>
            <div class="question-box">
                <input type="hidden" id="editIndex" value="-1">
                <label>ചോദ്യത്തിന്റെ തരം (Question Type):</label><br>
                <select id="newQType" onchange="toggleOptionsInput()" style="width:100%; padding:6px; margin-top:5px; margin-bottom:10px;">
                    <option value="short">ഷോർട്ട് ആൻസർ (Short Answer / Fill in the blanks)</option>
                    <option value="mcq">മൾട്ടിപ്പിൾ ചോയ്സ് (Multiple Choice / Options)</option>
                </select>

                <label>ചോദ്യം:</label><br>
                <input type="text" id="newQText" placeholder="ചോദ്യം ഇവിടെ എഴുതുക"><br><br>
                
                <div id="optionsInputContainer" style="display:none;">
                    <label>ഓപ്ഷനുകൾ നൽകുക (കോമ (,) ഉപയോഗിച്ച് വേർതിരിക്കുക):</label><br>
                    <input type="text" id="newQOptions" placeholder="ഉദാ: മക്ക, മദീന, ജിദ്ദ,ത്വാഇഫ്"><br><br>
                </div>

                <label>ശരിയായ ഉത്തരം:</label><br>
                <input type="text" id="newQAns" placeholder="ഷോർട്ട് ആൻസറിന് ഉത്തരവും, MCQ എങ്കിൽ ശരിയായ ഓപ്ഷനും നൽകുക"><br><br>
                
                <label>മാർക്ക്:</label><br>
                <input type="text" id="newQMark" value="2" style="width: 50px;"><br><br>
                
                <button class="admin-action-btn" id="saveBtn" onclick="saveOrUpdateQuestion()" style="background: #0b5ed7;">+ ചോദ്യം ആഡ് ചെയ്യുക</button>
                <button class="admin-action-btn" id="cancelEditBtn" onclick="resetForm()" style="background: #6c757d; display:none; margin-top:5px;">റദ്ദാക്കുക</button>
            </div>

            <div class="section-title">നിലവിലുള്ള ചോദ്യങ്ങൾ</div>
            <div id="adminQuestionsList"></div>

            <button class="admin-action-btn" onclick="resetToDefault()" style="background: #dc3545; margin-top: 20px;">ഡീഫോൾട്ട് ചോദ്യങ്ങളിലേക്ക് റീസെറ്റ് ചെയ്യുക</button>
        </div>
    </div>
</div>

<script>
    const defaultQuestions = [
        { id: 1, type: "short", text: "I. ഈ ലോകം നശിച്ചതിന് ശേഷമുള്ള ദിവസമാണ് ....................", options: [], ans: ["അവസാനനാൾ", "അവസാന നാൾ"], mark: 2 },
        { id: 2, type: "short", text: "I. നമ്മുടെ നബിയുടെ പേര് കേൾക്കുമ്പോൾ നാം .................... എന്ന് പറയണം.", options: [], ans: ["സ്വല്ലല്ലാഹുഅലൈഹിവസല്ലം", "സ്വല്ലല്ലാഹു അലൈഹിവസല്ലം", "സ", "സല്ലം"], mark: 2 },
        { id: 3, type: "short", text: "I. ഭൂമി പടച്ചത് ....................", options: [], ans: ["അല്ലാഹുവാണ്", "അല്ലാഹു"], mark: 2 },
        { id: 4, type: "short", text: "I. ഈമാൻ കാര്യങ്ങളിൽ മൂന്നാമത്തേത് ....................", options: [], ans: ["അല്ലാഹുവിന്റെകിതാബുകളിൽവിശ്വസിക്കൽ", "കിതാബുകളിൽ വിശ്വസിക്കൽ"], mark: 2 },
        { id: 5, type: "short", text: "I. അല്ലാഹു പ്രകാശം കൊണ്ട് സൃഷ്ടിച്ചവരാണ് ....................", options: [], ans: ["മലക്കുകൾ"], mark: 2 },
        { id: 6, type: "short", text: "II. നബുവ്വത്ത് ലഭിച്ചപ്പോൾ നബിയുടെ വയസ്സ്: ....................", options: [], ans: ["40", "നാല്പത്", "നാൽപ്പത്"], mark: 2 },
        { id: 7, type: "short", text: "II. മക്കയിൽ നിന്ന് മദീനയിലേക്ക് ഹിജ്റ പോകുമ്പോൾ വയസ്സ്: ....................", options: [], ans: ["53", "അമ്പത്തിമൂന്ന്"], mark: 2 },
        { id: 8, type: "short", text: "II. മദീനയിൽ വഫാതാകുമ്പോൾ വയസ്സ്: ....................", options: [], ans: ["63", "അറുപത്തിമൂന്ന്"], mark: 2 },
        { id: 9, type: "short", text: "III. നബി ﷺ യുടെ മാതാവ്: ....................", options: [], ans: ["ആമിന", "ആമിനബീവി"], mark: 2 },
        { id: 10, type: "short", text: "III. നബി ﷺ യുടെ പിതാവ്: ....................", options: [], ans: ["അബ്ദുല്ല"], mark: 2 },
        { id: 11, type: "short", text: "III. നബി ﷺ യുടെ ജന്മ സ്ഥലം: ....................", options: [], ans: ["മക്ക"], mark: 2 },
        { id: 12, type: "short", text: "IV. ആദം (അ) : ഏട് [10] എങ്കിൽ 30 ഏട് നൽകപ്പെട്ടയാൾ: ....................", options: [], ans: ["ഷീഥ്", "ഷീത്"], mark: 2 },
        { id: 13, type: "short", text: "IV. ഏട് [50] നൽകപ്പെട്ട നബി: ....................", options: [], ans: ["ഇദ്‌രീസ്", "ഇദ്രിസ്", "ഇദ്റീസ്"], mark: 2 },
        { id: 14, type: "short", text: "IV. ഏട് [10] നൽകപ്പെട്ട മറ്റൊരു നബി: ....................", options: [], ans: ["ഇബ്‌റാഹീം", "ഇബ്രാഹിം"], mark: 2 },
        { id: 15, type: "short", text: "IV. മുഹമ്മദ് (സ) : ഖുർആൻ എങ്കിൽ തൗറാത്ത് നൽകപ്പെട്ടത് ആർക്ക്? ....................", options: [], ans: ["മൂസാ", "മൂസാ (അ)"], mark: 2 },
        { id: 16, type: "short", text: "IV. സബൂർ നൽകപ്പെട്ട നബി: ....................", options: [], ans: ["ദാവൂദ്", "ദാവൂദ് (അ)"], mark: 2 },
        { id: 17, type: "short", text: "IV. ഇൻജീൽ നൽകപ്പെട്ട നബി: ....................", options: [], ans: ["ഈസാ", "ഈസാ (അ)"], mark: 2 },
        { id: 18, type: "mcq", text: "V. എപ്പോഴാണ് ഈ ലോകം നശിക്കുക?", options: ["അന്ത്യനാളിൽ", "ലോകാവസാനത്തിൽ", "ഖിയാമത്ത് നാളിൽ", "അല്ലാഹു ഉദ്ദേശിക്കുമ്പോൾ"], ans: ["അന്ത്യനാളിൽ"], mark: 3 },
        { id: 19, type: "mcq", text: "V. നബിമാർ എന്ന് പറയുന്നു ആർക്ക്?", options: ["സന്മാർഗ്ഗം പഠിപ്പിക്കാൻ", "പ്രവാചകൻമാർ", "സന്മാർഗം പഠിപ്പിക്കാൻ നിയോഗിക്കപ്പെട്ടവർ"], ans: ["പ്രവാചകൻമാർ"], mark: 3 },
        { id: 20, type: "short", text: "VI. ആരാധനക്ക് അർഹൻ അല്ലാഹു അല്ലാതെ ....................", options: [], ans: ["ഇല്ല", "മറ്റാര്മില്ല"], mark: 2 },
        { id: 21, type: "short", text: "VI. മലക്കുകൾ എപ്പോഴും അല്ലാഹുവിന്ന് ....................", options: [], ans: ["നൂർ", "കീഴ്‍പ്പെടുന്നു", "വഴങ്ങുന്നു"], mark: 2 },
        { id: 22, type: "short", text: "VI. ജനങ്ങളെ സന്മാർഗത്തിലേക്ക് നയിക്കുന്നതാണ് അല്ലാഹു വിൻ്റെ ....................", options: [], ans: ["വേദങ്ങൾ", "സന്ദേശം", "പ്രവാചകന്മാർ"], mark: 2 },
        { id: 23, type: "short", text: "VI. നബിമാരിൽ പ്രധാനികളാണ് ....................", options: [], ans: ["റസൂലുകൾ", "മുൻകഴിഞ്ഞ നബിമാർ", "പ്രവാചകർ"], mark: 2 },
        { id: 24, type: "short", text: "VI. സൂറിൽ രണ്ടാമത് ഊതുമ്പോൾ മരിച്ചവരെല്ലാം ....................", options: [], ans: ["ജീവോടെ എഴുന്നേൽക്കും", "ഉയിർത്തെഴുന്നേൽക്കും", "പുനർജനിക്കും"], mark: 2 }
    ];

    function getStoredQuestions() {
        let saved = localStorage.getItem('madrassa_aqeedah_q_v2');
        return saved ? JSON.parse(saved) : defaultQuestions;
    }

    function saveQuestions(questions) {
        localStorage.setItem('madrassa_aqeedah_q_v2', JSON.stringify(questions));
    }

    function getHeaderSettings() {
        let madrasa = localStorage.getItem('madrasa_name') || "ബദ്റുൽ ഹുദാ മദ്റസ പൊറോപാട്";
        let exam = localStorage.getItem('exam_title') || "അഖീദ - ക്ലാസ് 2 (അർദ്ദവാർഷിക പരീക്ഷ)";
        return { madrasa, exam };
    }

    function updateHeaderDisplay() {
        let settings = getHeaderSettings();
        document.getElementById('displayMadrasaName').innerText = settings.madrasa;
        document.getElementById('displayExamTitle').innerText = settings.exam;
        document.getElementById('pageTitle').innerText = settings.exam;
        
        if(document.getElementById('inputMadrasaName')) {
            document.getElementById('inputMadrasaName').value = settings.madrasa;
            document.getElementById('inputExamTitle').value = settings.exam;
        }
    }

    function saveHeaderSettings() {
        let madrasa = document.getElementById('inputMadrasaName').value.trim();
        let exam = document.getElementById('inputExamTitle').value.trim();
        localStorage.setItem('madrasa_name', madrasa);
        localStorage.setItem('exam_title', exam);
        updateHeaderDisplay();
        alert("ഹെഡിങ് വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!");
    }

    function cleanText(txt) {
        if(!txt) return "";
        return txt.trim().toLowerCase().replace(/[\sﷺ(അ)(സ)]/g, "");
    }

    function toggleOptionsInput() {
        let type = document.getElementById('newQType').value;
        let container = document.getElementById('optionsInputContainer');
        if(type === 'mcq') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function loadStudentQuestions() {
        updateHeaderDisplay();
        let questions = getStoredQuestions();
        let container = document.getElementById('questionsContainer');
        container.innerHTML = "";
        let totalMarksCount = 0;

        questions.forEach((q, index) => {
            totalMarksCount += parseInt(q.mark);
            let html = `
                <div class="question-box" id="q${index+1}_box">
                    ${index+1}. ${q.text} <span style="float:right; color:#666; font-size:0.85rem;">[മാർക്ക്: ${q.mark}]</span><br>
            `;

            if(q.type === 'mcq' && q.options && q.options.length > 0) {
                html += `<div class="options-group">`;
                q.options.forEach((opt, oIndex) => {
                    html += `
                        <label style="cursor:pointer;">
                            <input type="radio" name="q${index+1}_opt" value="${opt}"> ${opt}
                        </label>
                    `;
                });
                html += `</div>`;
            } else {
                html += `<input type="text" id="q${index+1}" placeholder="ഉത്തരം എഴുതുക">`;
            }

            html += `<div class="feedback" id="fb${index+1}"></div></div>`;
            container.innerHTML += html;
        });
        document.getElementById('displayTotalMark').innerText = `ആകെ മാർക്ക്: ${totalMarksCount}`;
    }

    function checkAdminLogin() {
        let pass = document.getElementById('adminPass').value;
        if(pass === "admin123") {
            document.getElementById('adminLoginBox').style.display = 'none';
            document.getElementById('adminPanelContent').style.display = 'block';
            loadAdminQuestionsList();
        } else {
            alert("തെറ്റായ പാസ്‌വേഡ്! (admin123 നൽകുക)");
        }
    }

    function loadAdminQuestionsList() {
        let questions = getStoredQuestions();
        let listContainer = document.getElementById('adminQuestionsList');
        listContainer.innerHTML = "";
        questions.forEach((q, index) => {
            let typeText = q.type === 'mcq' ? 'മൾട്ടിപ്പിൾ ചോയ്സ് (MCQ)' : 'ഷോർട്ട് ആൻസർ';
            listContainer.innerHTML += `
                <div class="question-box">
                    <b>ചോദ്യം ${index+1} [${typeText}]:</b> ${q.text}<br>
                    ${q.type === 'mcq' ? `<small><b>ഓപ്ഷനുകൾ:</b> ${q.options.join(', ')}</small><br>` : ''}
                    <small><b>ശരിയായ ഉത്തരം:</b> ${q.ans.join(', ')} | <b>മാർക്ക്:</b> ${q.mark}</small><br>
                    <button class="edit-btn" onclick="editQuestion(${index})">എഡിറ്റ് ചെയ്യുക</button>
                    <button class="delete-btn" onclick="deleteQuestion(${index})">ഡിലീറ്റ് ചെയ്യുക</button>
                </div>
            `;
        });
    }

    function saveOrUpdateQuestion() {
        let type = document.getElementById('newQType').value;
        let text = document.getElementById('newQText').value.trim();
        let ansStr = document.getElementById('newQAns').value.trim();
        let mark = document.getElementById('newQMark').value.trim();
        let editIndex = parseInt(document.getElementById('editIndex').value);

        if(!text || !ansStr) {
            alert("ചോദ്യവും ഉത്തരവും നിർബന്ധമായും നൽകുക!");
            return;
        }

        let optionsArray = [];
        if(type === 'mcq') {
            let optStr = document.getElementById('newQOptions').value.trim();
            if(!optStr) {
                alert("MCQ ചോദ്യങ്ങൾക്ക് ഓപ്ഷനുകൾ നൽകേണ്ടതാണ്!");
                return;
            }
            optionsArray = optStr.split(',').map(o => o.trim());
        }

        let ansArray = ansStr.split(',').map(a => a.trim());
        let questions = getStoredQuestions();

        let questionObj = {
            id: editIndex === -1 ? questions.length + 1 : questions[editIndex].id,
            type: type,
            text: text,
            options: optionsArray,
            ans: ansArray,
            mark: parseInt(mark) || 2
        };

        if (editIndex === -1) {
            questions.push(questionObj);
            alert("പുതിയ ചോദ്യം വിജയകരമായി ചേർത്തു!");
        } else {
            questions[editIndex] = questionObj;
            alert("ചോദ്യം വിജയകരമായി മാറ്റം വരുത്തി!");
            resetForm();
        }

        saveQuestions(questions);
        resetFormInputs();
        loadAdminQuestionsList();
    }

    function resetFormInputs() {
        document.getElementById('newQText').value = "";
        document.getElementById('newQAns').value = "";
        document.getElementById('newQOptions').value = "";
        document.getElementById('newQMark').value = "2";
        document.getElementById('newQType').value = "short";
        toggleOptionsInput();
    }

    function editQuestion(index) {
        let questions = getStoredQuestions();
        let q = questions[index];

        document.getElementById('newQType').value = q.type || 'short';
        toggleOptionsInput();
        document.getElementById('newQText').value = q.text;
        document.getElementById('newQAns').value = q.ans.join(', ');
        if(q.type === 'mcq' && q.options) {
            document.getElementById('newQOptions').value = q.options.join(', ');
        }
        document.getElementById('newQMark').value = q.mark;
        document.getElementById('editIndex').value = index;

        document.getElementById('formTitleText').innerText = `ചോദ്യം ${index+1} എഡിറ്റ് ചെയ്യുക`;
        document.getElementById('saveBtn').innerText = "✔ മാറ്റങ്ങൾ സേവ് ചെയ്യുക";
        document.getElementById('saveBtn').style.background = "#ffc107";
        document.getElementById('saveBtn').style.color = "#000";
        document.getElementById('cancelEditBtn').style.display = "block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        resetFormInputs();
        document.getElementById('editIndex').value = "-1";
        document.getElementById('formTitleText').innerText = "പുതിയ ചോദ്യം ചേർക്കാം";
        document.getElementById('saveBtn').innerText = "+ ചോദ്യം ആഡ് ചെയ്യുക";
        document.getElementById('saveBtn').style.background = "#0b5ed7";
        document.getElementById('saveBtn').style.color = "#fff";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function deleteQuestion(index) {
        if(confirm("ഈ ചോദ്യം ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
            let questions = getStoredQuestions();
            questions.splice(index, 1);
            saveQuestions(questions);
            loadAdminQuestionsList();
        }
    }

    function resetToDefault() {
        if(confirm("എല്ലാ മാറ്റങ്ങളും ഒഴിവാക്കി പഴയ ചോദ്യങ്ങളിലേക്ക് മാറ്റണമെന്നുണ്ടോ?")) {
            localStorage.removeItem('madrassa_aqeedah_q_v2');
            localStorage.removeItem('madrasa_name');
            localStorage.removeItem('exam_title');
            loadAdminQuestionsList();
            resetForm();
            updateHeaderDisplay();
            alert("റീസെറ്റ് ചെയ്തിരിക്കുന്നു!");
        }
    }

    function evaluateExam(event) {
        event.preventDefault();
        let name = document.getElementById("studentName").value.trim();
        if(!name) {
            alert("ദയവായി കുട്ടിയുടെ പേര് എഴുതുക!");
            document.getElementById("studentName").focus();
            return;
        }

        let questions = getStoredQuestions();
        let totalScore = 0;
        let maxPossibleScore = 0;

        questions.forEach((q, index) => {
            maxPossibleScore += parseInt(q.mark);
            let qIndexNum = index + 1;
            let box = document.getElementById("q" + qIndexNum + "_box");
            let fb = document.getElementById("fb" + qIndexNum);
            let isCorrect = false;

            if(q.type === 'mcq') {
                let radios = document.getElementsByName("q" + qIndexNum + "_opt");
                let selectedVal = "";
                for(let r of radios) {
                    if(r.checked) {
                        selectedVal = r.value;
                        break;
                    }
                }
                for(let ans of q.ans) {
                    if(cleanText(selectedVal) === cleanText(ans)) {
                        isCorrect = true;
                        break;
                    }
                }
            } else {
                let qId = "q" + qIndexNum;
                let userVal = document.getElementById(qId).value;
                let cleanedUserVal = cleanText(userVal);
                for (let ans of q.ans) {
                    if (cleanedUserVal !== "" && cleanedUserVal.includes(cleanText(ans))) {
                        isCorrect = true;
                        break;
                    }
                }
            }

            if (isCorrect) {
                totalScore += parseInt(q.mark);
                box.className = "question-box correct";
                fb.style.color = "#198754";
                fb.innerHTML = "✔ ശരിയാണ്!";
            } else {
                box.className = "question-box incorrect";
                fb.style.color = "#dc3545";
                fb.innerHTML = `✘ ശരിയായ ഉത്തരം: ${q.ans[0]}`;
            }
        });

        const resultCard = document.getElementById("resultCard");
        resultCard.style.display = "block";
        resultCard.innerHTML = `അഭിനന്ദനങ്ങൾ, ${name}!<br>നിങ്ങൾക്ക് ${maxPossibleScore}-ൽ <b>${totalScore}</b> മാർക്ക് ലഭിച്ചു! 🎉`;
        resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('adminView').style.display = 'block';
            document.getElementById('studentView').style.display = 'none';
        } else {
            loadStudentQuestions();
        }
    };
